<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCA-F 학습 코치</title>
<!-- v2-5 웹 UI: src/api.py가 GET /로 서빙. 바닐라 JS, 외부 의존성 없음.
     정답은 서버 코드(submit_answer)만 안다. 이 페이지는 사용자가 고른 글자를 /query로 보낼 뿐이다. -->
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677; --border: #dde1e8;
  --accent: #3b5bdb; --accent-text: #ffffff; --user: #e7ecfb; --bot: #ffffff;
  --code: #f1f3f6; --ok: #2b8a3e; --err: #c92a2a; --bar: #d8deea; --badge: #e6f4ea; --badge-text: #22663a;
  --ok-bg: #ebf7ee; --err-bg: #fdecec;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1c2027; --text: #e4e7ec; --muted: #9aa3b2; --border: #2e343e;
    --accent: #7c95f0; --accent-text: #10131a; --user: #26304a; --bot: #1c2027;
    --code: #252a33; --ok: #69db7c; --err: #ff8787; --bar: #2e343e; --badge: #1f3a2a; --badge-text: #8ce99a;
    --ok-bg: #1d3325; --err-bg: #3a2023;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --panel: #1c2027; --text: #e4e7ec; --muted: #9aa3b2; --border: #2e343e;
  --accent: #7c95f0; --accent-text: #10131a; --user: #26304a; --bot: #1c2027;
  --code: #252a33; --ok: #69db7c; --err: #ff8787; --bar: #2e343e; --badge: #1f3a2a; --badge-text: #8ce99a;
    --ok-bg: #1d3325; --err-bg: #3a2023;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
}
button, input, textarea { font: inherit; color: inherit; }
.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; height: 100dvh; }
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
}
header h1 { font-size: 16px; margin: 0 auto 0 0; }
header label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
header input { width: 130px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
header input.invalid { border-color: var(--err); }
.btn {
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--panel); cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.main { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
.chat { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
#log { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 820px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--user); white-space: pre-wrap; }
.msg.bot { align-self: flex-start; background: var(--bot); width: 100%; }
.msg.error { border-color: var(--err); color: var(--err); }
.msg p { margin: 0 0 8px; }
.msg p:last-child { margin-bottom: 0; }
.msg ul, .msg ol { margin: 0 0 8px; padding-left: 22px; }
.msg h3 { font-size: 15px; margin: 8px 0 4px; }
.msg pre {
  background: var(--code); padding: 10px; border-radius: 6px; margin: 0 0 8px;
  white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px;
}
.msg code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
.msg pre code { background: none; padding: 0; }
.cite { display: inline-block; background: var(--badge); color: var(--badge-text); border-radius: 4px; padding: 0 6px; font-size: 13px; }
.cite-row { font-size: 13px; color: var(--muted); }
button.cite { border: 1px solid transparent; cursor: pointer; font: inherit; font-size: 13px; }
button.cite:hover, button.cite:focus-visible, button.cite[aria-expanded="true"] { border-color: var(--badge-text); outline: none; }
.source {
  margin: 8px 0; padding: 10px 12px; border-left: 3px solid var(--badge-text); border-radius: 6px;
  background: var(--code); font-size: 13px; max-height: 280px; overflow-y: auto; white-space: pre-wrap;
}
.source .src-head { font-weight: 700; margin-bottom: 4px; white-space: normal; }
.source .src-note { color: var(--muted); white-space: normal; }
.skeleton { width: 100%; }
.skeleton .bar { height: 10px; border-radius: 5px; background: var(--bar); margin: 8px 0; animation: pulse 1.4s ease-in-out infinite; }
.skeleton .bar:nth-child(2) { width: 85%; } .skeleton .bar:nth-child(3) { width: 60%; }
.skeleton .stage { font-size: 14px; color: var(--muted); }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .skeleton .bar { animation: none; } }
body:not(.show-trace) details.trace { display: none; }
.dev { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 12px; color: var(--muted); cursor: pointer; }
.choices { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.choices .btn { min-width: 48px; font-weight: 600; }
.options { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 10px; }
.opt {
  display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left;
  padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); cursor: pointer; line-height: 1.5;
}
.opt:hover:not(:disabled), .opt:focus-visible { border-color: var(--accent); outline: none; }
.opt:disabled { cursor: default; }
.opt .key {
  flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid var(--border); font-weight: 700; font-size: 13px; background: var(--panel);
}
.opt.picked { border-color: var(--accent); }
.opt.picked .key { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.right .key { background: var(--ok); color: var(--panel); border-color: var(--ok); }
.opt.wrong { border-color: var(--err); background: var(--err-bg); }
.opt.wrong .key { background: var(--err); color: var(--panel); border-color: var(--err); }
.opt-hint { font-size: 13px; color: var(--muted); margin: 0 0 4px; }
.verdict { font-weight: 700; margin: -10px -14px 10px; padding: 8px 14px; border-radius: 10px 10px 0 0; }
.msg.graded-ok { border-color: var(--ok); }
.msg.graded-ok .verdict { background: var(--ok-bg); color: var(--ok); }
.msg.graded-bad { border-color: var(--err); }
.msg.graded-bad .verdict { background: var(--err-bg); color: var(--err); }
.next { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.next .btn { font-size: 14px; border-radius: 16px; }
details.trace { margin-top: 8px; font-size: 13px; color: var(--muted); }
details.trace summary { cursor: pointer; }
details.trace ul { margin: 4px 0 0; padding-left: 18px; }
.examples { display: flex; flex-wrap: wrap; gap: 8px; }
.examples .btn { font-size: 14px; border-radius: 16px; }
.intro { color: var(--muted); }
form#ask { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); }
form#ask textarea {
  flex: 1; min-width: 0; resize: none; padding: 8px 10px; height: 44px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
}
.waiting { color: var(--muted); font-size: 14px; }
aside {
  border-left: 1px solid var(--border); background: var(--panel);
  padding: 14px 16px; overflow-y: auto;
}
aside h2 { font-size: 15px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
aside .btn { padding: 2px 8px; font-size: 12px; }
.stat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.stat div { background: var(--bg); border-radius: 8px; padding: 8px; }
.stat b { display: block; font-size: 18px; }
.stat span { font-size: 12px; color: var(--muted); }
.dom {
  display: block; width: 100%; text-align: left; margin-bottom: 6px; font-size: 13px;
  padding: 6px 8px; border: 1px solid transparent; border-radius: 8px; background: none; cursor: pointer;
}
.dom:hover:not(:disabled), .dom:focus-visible { border-color: var(--accent); outline: none; }
.dom:disabled { cursor: default; opacity: .6; }
.dom .name { display: flex; justify-content: space-between; gap: 8px; }
.dom .name > span:last-child { color: var(--muted); white-space: nowrap; }
.dom .track, .dom .fill { display: block; }
.dom .go { color: var(--accent); visibility: hidden; }
.dom:hover:not(:disabled) .go, .dom:focus-visible .go { visibility: visible; }
.dom.weak { border-color: var(--err); background: var(--err-bg); }
.dom.weak .fill { background: var(--err); }
.weak-tag { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 700; background: var(--err); color: var(--panel); white-space: nowrap; }
.weak-box { font-size: 13px; background: var(--bg); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }
.weak-box .btn { margin-top: 6px; padding: 4px 10px; font-size: 13px; }
#toggleProgress, #closeProgress { display: none; }
#backdrop { display: none; }
.track { height: 8px; background: var(--bar); border-radius: 4px; margin-top: 3px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); }
.note { font-size: 12px; color: var(--muted); }
@media (max-width: 760px) {
  .app { height: auto; min-height: 100vh; }
  .main { grid-template-columns: 1fr; }
  .chat { grid-template-rows: auto auto; }
  #log { overflow: visible; min-height: 50vh; }
  form#ask { position: sticky; bottom: 0; }
  header input { width: 110px; }
  /* 모바일: 진도 패널은 헤더 "진도" 버튼으로 여는 아래 시트 */
  #toggleProgress, #closeProgress { display: inline-block; }
  aside {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 80vh;
    border-left: 0; border-top: 1px solid var(--border); border-radius: 14px 14px 0 0;
    box-shadow: 0 -6px 24px rgba(0, 0, 0, .25); transform: translateY(105%); transition: transform .2s ease;
  }
  body.sheet-open aside { transform: none; }
  body.sheet-open #backdrop { display: block; position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .35); }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>CCA-F 학습 코치</h1>
    <label>user_id
      <input id="uid" list="uids" autocomplete="off" spellcheck="false">
      <datalist id="uids"><option value="web_demo"><option value="demo_heavy"><option value="demo_new"></datalist>
    </label>
    <button class="btn" id="toggleProgress" type="button" aria-controls="progressPanel">진도</button>
    <button class="btn" id="reset" type="button">새 대화</button>
  </header>
  <div class="main">
    <section class="chat">
      <div id="log" aria-live="polite"></div>
      <form id="ask">
        <textarea id="q" maxlength="2000" placeholder="질문하거나 문제를 요청하세요" title="Enter 전송, Shift+Enter 줄바꿈"></textarea>
        <button class="btn primary" id="send" type="submit">보내기</button>
      </form>
    </section>
    <aside id="progressPanel">
      <h2>진도 <span><button class="btn" id="refresh" type="button">새로고침</button>
        <button class="btn" id="closeProgress" type="button" aria-label="진도 닫기">닫기</button></span></h2>
      <div id="progress"><p class="note">불러오는 중…</p></div>
      <label class="dev"><input type="checkbox" id="showTrace"> 개발 정보(trace) 표시</label>
    </aside>
  </div>
</div>
<div id="backdrop"></div>
<script>
const USER_ID_RE = /^[A-Za-z0-9_-]{1,64}$/;
const EXAMPLES = [
  "Domain 2에서 연습 문제 하나 내줘",
  "TS 1.4 핵심 내용을 정리해줘",
  "시험까지 14일, 하루 2시간이야. 학습 계획 짜줘",
  "내 약점 도메인이 어디야?",
];
const $ = (id) => document.getElementById(id);
const log = $("log"), q = $("q"), send = $("send"), uid = $("uid");
let threadId = null, busy = false;
const sources = new Map();      // doc_id → 가이드 원문 (이번 대화에서 받은 contexts). 채점 턴은 출제 턴의 TS 청크를 쓴다

function store(key, value) {
  try { value === undefined ? (value = localStorage.getItem(key)) : localStorage.setItem(key, value); } catch (e) { return null; }
  return value;
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// 코치 답변용 작은 마크다운: 이스케이프 후 코드블록·목록·제목·굵게·인라인 코드·근거 배지만 처리
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[근거:([^\]]+)\]/g, (_, body) => {
      // TS 번호마다 누르면 가이드 원문 발췌를 펼치는 버튼. TS 번호가 없으면 배지만
      const ids = body.match(/TS-\d+\.\d+/g);
      if (!ids) return `<span class="cite">근거:${body}</span>`;
      return '<span class="cite-row">근거: ' + ids.map((id) =>
        `<button type="button" class="cite" data-doc="${id}" aria-expanded="false" title="가이드 원문 보기">${id}</button>`).join(" ") + "</span>";
    });
}

function renderMarkdown(text) {
  const lines = esc(text).split(/\r?\n/);
  const out = [];
  let para = [], list = null, code = null;
  const flushPara = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>` + list.items.map((i) => `<li>${inline(i)}</li>`).join("") + `</${list.tag}>`); list = null; } };
  for (const line of lines) {
    if (code) {
      if (/^\s*```/.test(line)) { out.push("<pre><code>" + code.join("\n") + "</code></pre>"); code = null; }
      else code.push(line);
      continue;
    }
    if (/^\s*```/.test(line)) { flushPara(); flushList(); code = []; continue; }
    const ul = line.match(/^\s*[-*]\s+(.*)$/), ol = line.match(/^\s*\d+[.)]\s+(.*)$/), h = line.match(/^#{1,4}\s+(.*)$/);
    if (ul || ol) {
      flushPara();
      const tag = ul ? "ul" : "ol";
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push((ul || ol)[1]);
    } else if (h) {
      flushPara(); flushList(); out.push("<h3>" + inline(h[1]) + "</h3>");
    } else if (!line.trim()) {
      flushPara(); flushList();
    } else {
      flushList(); para.push(line);
    }
  }
  if (code) out.push("<pre><code>" + code.join("\n") + "</code></pre>");
  flushPara(); flushList();
  return out.join("");
}

function scrollDown() { log.scrollTop = log.scrollHeight; window.scrollTo(0, document.body.scrollHeight); }

function addUser(text) {
  const el = document.createElement("div");
  el.className = "msg user";
  el.textContent = text;
  log.appendChild(el);
  scrollDown();
}

function addError(text) {
  const el = document.createElement("div");
  el.className = "msg bot error";
  el.textContent = text;
  log.appendChild(el);
  scrollDown();
}

function traceSummary(data) {
  const t = data.trace || [];
  const items = [];
  const guard = t.find((s) => s.step === "guard");
  if (guard) items.push(`입력 가드: ${guard.action}${guard.rule ? ` (${guard.rule}, ${guard.layer})` : ""}`);
  const routes = t.filter((s) => s.step === "route").map((s) => s.agent);
  if (routes.length) items.push("경로: " + routes.join(" → "));
  const tools = (t.find((s) => s.step === "tools") || {}).names || [];
  if (tools.length) items.push("도구: " + tools.join(", "));
  const docs = (data.contexts || []).map((c) => c.doc_id);
  if (docs.length) items.push("근거 doc_id: " + docs.join(", "));
  const llm = t.find((s) => s.step === "llm");
  if (llm) items.push(`LLM ${llm.calls}회 · 입력 ${llm.input} / 출력 ${llm.output} 토큰`);
  const total = t.length ? Math.max(...t.map((s) => s.t || 0)) : null;
  const el = document.createElement("details");
  el.className = "trace";
  el.innerHTML = `<summary>trace${total != null ? ` · ${total.toFixed(1)}초` : ""}</summary><ul>` +
    items.map((i) => `<li>${esc(i)}</li>`).join("") + "</ul>";
  return el;
}

// 출제 답변을 문항 앞부분 · 보기(A~F) · 뒷부분으로 나눈다. 보기가 2개 미만이면 null (일반 렌더링)
function splitQuiz(answer) {
  const lines = answer.split(/\r?\n/);
  const idx = [], options = [];
  lines.forEach((line, i) => {
    const m = line.match(/^\s*([A-F])[.)]\s+(.*)$/);
    if (m) { idx.push(i); options.push({ label: m[1], text: m[2] }); }
  });
  if (options.length < 2) return null;
  return { before: lines.slice(0, idx[0]).join("\n"), options,
           after: lines.slice(idx[idx.length - 1] + 1).join("\n") };
}

let activeQuiz = null;          // 답을 기다리는 문항 카드 묶음 {cards}

function disableChoices() {
  document.querySelectorAll(".choices .btn, .opt").forEach((b) => { b.disabled = true; });
}

function pick(label) {
  if (!activeQuiz || busy) return;
  const card = activeQuiz.cards[label];
  if (!card) return;
  card.classList.add("picked");
  ask(label);
}

function quizBlock(el, answer) {
  const q = splitQuiz(answer);
  if (!q) {      // 보기를 못 찾으면 예전처럼 A~D 버튼
    el.innerHTML = renderMarkdown(answer);
    const row = document.createElement("div");
    row.className = "choices";
    const cards = {};
    for (const label of ["A", "B", "C", "D"]) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "btn";
      b.textContent = label;
      b.addEventListener("click", () => pick(label));
      row.appendChild(b);
      cards[label] = b;
    }
    el.appendChild(row);
    return cards;
  }
  el.innerHTML = renderMarkdown(q.before);
  const hint = document.createElement("p");
  hint.className = "opt-hint";
  hint.textContent = "보기를 눌러 답하세요 · 키보드 " + q.options.map((o) => o.label).join("/");
  el.appendChild(hint);
  const box = document.createElement("div");
  box.className = "options";
  const cards = {};
  for (const o of q.options) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    b.innerHTML = `<span class="key">${o.label}</span><span>${inline(esc(o.text))}</span>`;
    b.addEventListener("click", () => pick(o.label));
    box.appendChild(b);
    cards[o.label] = b;
  }
  el.appendChild(box);
  // "답을 A~D 중 하나로 알려 주세요" 안내는 카드 힌트와 겹치므로 뺀다
  const rest = q.after.split(/\r?\n/).filter((l) => !/^\s*답을\s*[A-F]~[A-F]/.test(l)).join("\n");
  if (rest.trim()) el.insertAdjacentHTML("beforeend", renderMarkdown(rest));
  return cards;
}

// 채점 결과: 말풍선 머리줄 + 직전 문항 카드에 내 선택(정답/오답)과 정답 표시
function markGraded(el, submit, answer) {
  el.classList.add(submit.correct ? "graded-ok" : "graded-bad");
  const head = document.createElement("div");
  head.className = "verdict";
  head.textContent = submit.correct ? `✓ 정답 (선택 ${submit.choice})` : `✗ 오답 (선택 ${submit.choice})`;
  el.prepend(head);
  if (!activeQuiz) return;
  const correct = (answer.match(/정답\s*[:：]\s*([A-F])/) || [])[1];
  const mine = activeQuiz.cards[submit.choice];
  if (mine) { mine.classList.remove("picked"); mine.classList.add(submit.correct ? "right" : "wrong"); }
  if (correct && activeQuiz.cards[correct]) activeQuiz.cards[correct].classList.add("right");
}

// 채점 후 다음 행동 칩 (quiz_id "Q-2.4-K3" → TS-2.4, Domain 2)
function nextActions(el, submit) {
  const m = (submit.quiz_id || "").match(/^Q-(\d)\.(\d+)/);
  const items = [];
  if (m) {
    items.push([`Domain ${m[1]} 문제 하나 더`, `Domain ${m[1]}에서 연습 문제 하나 더 내줘`]);
    items.push(["다른 도메인 문제", `Domain ${m[1]} 말고 다른 도메인에서 연습 문제 하나 내줘`]);
    items.push([`TS ${m[1]}.${m[2]} 개념 설명`, `TS ${m[1]}.${m[2]} 핵심 개념을 설명해줘`]);
  } else {
    items.push(["다음 문제", "연습 문제 하나 더 내줘"]);
  }
  const row = document.createElement("div");
  row.className = "next";
  for (const [label, question] of items) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn";
    b.textContent = label;
    b.addEventListener("click", () => ask(question));
    row.appendChild(b);
  }
  el.appendChild(row);
}

function addBot(data) {
  const el = document.createElement("div");
  el.className = "msg bot";
  const answer = data.answer || "";
  const trace = data.trace || [];
  const submit = trace.find((s) => s.step === "submit" && s.status === "graded");
  const quizOk = trace.some((s) => s.step === "get_quiz" && s.status === "ok");
  if (quizOk) {
    el.dataset.quiz = "1";
  } else {
    el.innerHTML = renderMarkdown(answer);
  }
  if (submit) { markGraded(el, submit, answer); nextActions(el, submit); }
  activeQuiz = quizOk ? { cards: quizBlock(el, answer) } : null;
  el.appendChild(traceSummary(data));
  log.appendChild(el);
  scrollDown();
}

function setBusy(on) {
  busy = on;
  send.disabled = on;
  q.disabled = on;
  uid.disabled = on;
  document.querySelectorAll(".examples .btn, #progress [data-domain]").forEach((b) => { b.disabled = on; });
}

function openSheet() { document.body.classList.add("sheet-open"); }
function closeSheet() { document.body.classList.remove("sheet-open"); }

function currentUid() {
  const v = uid.value.trim();
  const ok = USER_ID_RE.test(v);
  uid.classList.toggle("invalid", !ok);
  return ok ? v : null;
}

async function ask(question) {
  question = question.trim();
  if (!question || busy) return;
  const user = currentUid();
  if (!user) { addError("user_id는 영문·숫자·_·-만 쓸 수 있습니다 (점 금지, 64자 이하)."); return; }
  disableChoices();
  addUser(question);
  setBusy(true);
  // 스트리밍이 없어 실제 진행 단계는 모른다 → 경과 시간에 따른 일반 문구만 보여 준다
  const wait = document.createElement("div");
  wait.className = "msg bot skeleton";
  wait.setAttribute("role", "status");
  wait.innerHTML = '<div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="stage"></div>';
  const stage = wait.querySelector(".stage");
  const t0 = Date.now();
  const tick = () => {
    const sec = Math.floor((Date.now() - t0) / 1000);
    const text = sec < 4 ? "질문을 확인하고 있어요"
      : sec < 30 ? "가이드를 찾아보고 답변을 정리하고 있어요 (보통 10~25초)"
      : "조금 더 걸리고 있어요. 잠시만 기다려 주세요";
    stage.textContent = `${text} · ${sec}초`;
  };
  tick();
  const timer = setInterval(tick, 1000);
  log.appendChild(wait);
  scrollDown();
  try {
    const res = await fetch("/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, user_id: user, thread_id: threadId }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const d = data.detail;
      throw new Error(typeof d === "string" ? d : `요청 실패 (HTTP ${res.status})`);
    }
    threadId = data.thread_id;
    for (const c of data.contexts || []) sources.set(c.doc_id, c.text);
    addBot(data);
    if ((data.trace || []).some((s) => s.step === "submit" && s.status === "graded")) loadProgress();
  } catch (e) {
    addError("오류: " + (e.message || "서버에 연결할 수 없습니다."));
  } finally {
    clearInterval(timer);
    wait.remove();
    setBusy(false);
    q.focus();
  }
}

function pct(x) { return x == null ? "–" : Math.round(x * 100) + "%"; }

async function loadProgress() {
  const box = $("progress");
  const user = currentUid();
  if (!user) { box.innerHTML = '<p class="note">user_id 형식이 올바르지 않습니다.</p>'; return; }
  try {
    const res = await fetch("/progress?user_id=" + encodeURIComponent(user));
    const p = await res.json();
    if (!res.ok || p.isError) throw new Error(p.message || p.detail || `HTTP ${res.status}`);
    // 약점 판정은 서버 get_weak_domains 결과(weak)를 그대로 쓴다 (UI에서 계산하지 않음)
    const weak = p.weak && !p.weak.isError ? p.weak : null;
    const weakIds = new Set(weak ? weak.top.map((w) => w.domain) : []);
    const dis = busy ? " disabled" : "";
    const doms = p.domains.map((d) => `
      <button type="button" class="dom${weakIds.has(d.domain) ? " weak" : ""}" data-domain="${d.domain}"${dis}
        title="Domain ${d.domain} 연습 문제 풀기">
        <span class="name"><span>D${d.domain} ${esc(d.name)}${weakIds.has(d.domain) ? '<span class="weak-tag">약점</span>' : ""}</span>
          <span>${pct(d.accuracy)} · ${d.correct}/${d.attempts}</span></span>
        <span class="track"><span class="fill" style="width:${d.accuracy == null ? 0 : d.accuracy * 100}%"></span></span>
        <span class="name note"><span>시험 비중 ${pct(d.weight)}</span><span class="go">문제 풀기 →</span></span>
      </button>`).join("");
    let weakBox = "";
    if (weak && weak.top.length) {
      const names = weak.top.map((w) => `D${w.domain} (정답률 ${pct(w.accuracy)})`).join(", ");
      weakBox = `<div class="weak-box">약점 도메인: <b>${esc(names)}</b>
        <br><button type="button" class="btn primary" id="weakQuiz" data-domain="${weak.top[0].domain}"${dis}>D${weak.top[0].domain} 약점 문제 풀기</button></div>`;
    } else if (weak) {
      weakBox = `<div class="weak-box note">${esc(weak.message || "약점을 판단할 기록이 부족합니다.")}</div>`;
    }
    box.innerHTML = `
      <div class="stat">
        <div><b>${pct(p.accuracy)}</b><span>정답률 (${p.correct}/${p.attempts})</span></div>
        <div><b>${p.task_coverage.solved}/${p.task_coverage.total}</b><span>TS 커버리지</span></div>
        <div><b>${p.bullet_coverage.solved}/${p.bullet_coverage.total}</b><span>세부 항목 커버리지</span></div>
        <div><b>${p.last_answered_at ? esc(String(p.last_answered_at).slice(0, 10)) : "–"}</b><span>마지막 풀이</span></div>
      </div>${weakBox}${doms}
      <p class="note">막대는 도메인별 정답률. 도메인을 누르면 그 도메인 문제를 냅니다. 약점 점수 = 시험 비중 × (1 − 정답률), 시도 3회 이상 도메인만 (서버 계산).</p>`;
    box.querySelectorAll("[data-domain]").forEach((b) => b.addEventListener("click", () => {
      closeSheet();
      ask(`Domain ${b.dataset.domain}에서 연습 문제 하나 내줘`);
    }));
  } catch (e) {
    box.innerHTML = `<p class="note">진도를 불러오지 못했습니다: ${esc(e.message || "")}</p>`;
  }
}

function showIntro() {
  log.innerHTML = "";
  const el = document.createElement("div");
  el.className = "msg bot";
  el.innerHTML = `<p class="intro">CCA-F 시험 가이드 기반 학습 코치입니다. 개념 질문, 연습 문제 출제·채점, 학습 계획, 약점 분석을 도와드려요.</p>`;
  const ex = document.createElement("div");
  ex.className = "examples";
  for (const text of EXAMPLES) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn";
    b.textContent = text;
    b.addEventListener("click", () => ask(text));
    ex.appendChild(b);
  }
  el.appendChild(ex);
  log.appendChild(el);
}

$("ask").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = q.value;
  q.value = "";
  ask(text);
});
q.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("ask").requestSubmit(); }
});
// 답을 기다리는 문항이 있으면 입력창 밖에서 A~F 키로 고른다
document.addEventListener("keydown", (e) => {
  if (!activeQuiz || busy || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)) return;
  const label = e.key.toUpperCase();
  if (activeQuiz.cards[label]) { e.preventDefault(); pick(label); }
});
$("reset").addEventListener("click", () => {
  if (!busy) { threadId = null; activeQuiz = null; sources.clear(); showIntro(); q.focus(); }
});
$("refresh").addEventListener("click", loadProgress);
$("toggleProgress").addEventListener("click", () => {
  document.body.classList.contains("sheet-open") ? closeSheet() : (openSheet(), loadProgress());
});
$("closeProgress").addEventListener("click", closeSheet);

// 근거 배지 → 가이드 원문 발췌를 말풍선 안에 펼치고, 같은 배지를 다시 누르면 접는다
log.addEventListener("click", (e) => {
  const btn = e.target.closest("button.cite[data-doc]");
  if (!btn) return;
  const msg = btn.closest(".msg");
  const id = btn.dataset.doc;
  const open = msg.querySelector(".source");
  msg.querySelectorAll("button.cite").forEach((b) => b.setAttribute("aria-expanded", "false"));
  if (open) {
    const same = open.dataset.doc === id;
    open.remove();
    if (same) return;
  }
  const box = document.createElement("div");
  box.className = "source";
  box.dataset.doc = id;
  const text = sources.get(id);
  box.innerHTML = `<div class="src-head">${esc(id)} · 시험 가이드 원문</div>` + (text
    ? esc(text)
    : '<div class="src-note">이 대화에서 받은 검색 결과에 원문이 없습니다. 원문이 필요하면 이 TS를 질문해 보세요.</div>');
  (btn.closest("p, ul, ol") || btn.closest(".cite-row")).after(box);
  btn.setAttribute("aria-expanded", "true");
});

const showTrace = $("showTrace");
showTrace.checked = store("ccaf_show_trace") === "1";
document.body.classList.toggle("show-trace", showTrace.checked);
showTrace.addEventListener("change", () => {
  document.body.classList.toggle("show-trace", showTrace.checked);
  store("ccaf_show_trace", showTrace.checked ? "1" : "0");
});
$("backdrop").addEventListener("click", closeSheet);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
uid.addEventListener("change", () => {
  if (currentUid()) { store("ccaf_user_id", uid.value.trim()); threadId = null; activeQuiz = null; sources.clear(); showIntro(); }
  loadProgress();
});

uid.value = store("ccaf_user_id") || "web_demo";
showIntro();
loadProgress();
</script>
