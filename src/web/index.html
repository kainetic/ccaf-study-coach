<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCA-F 학습 코치</title>
<!-- 웹 UI: src/api.py가 GET /로 서빙. 마크업만 두고 스타일은 style.css, 동작은 app.js (/static). 외부 의존성 없음. -->
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true">C</span>
      <div>
        <h1>CCA-F 학습 코치</h1>
        <div class="sub">Claude Certified Architect – Foundations</div>
      </div>
    </div>
    <div class="actions">
      <label class="field" title="풀이 기록을 읽고 쓰는 데모 사용자 (로그인 없음)">프로필
        <select id="uid" aria-label="데모 사용자 프로필">
          <option value="web_demo">web_demo · 기본</option>
          <option value="demo_heavy">demo_heavy · 기록 61회</option>
          <option value="demo_new">demo_new · 신규</option>
        </select>
      </label>
      <button class="btn" id="reset" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>새 대화
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn icon" id="togglePanel" type="button" aria-controls="progressPanel" aria-expanded="true" title="학습 진도 패널 접기/펼치기">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
      </button>
    </div>
  </header>
  <div class="main">
    <section class="chat">
      <div id="log" aria-live="polite"></div>
      <form id="ask">
        <div class="composer">
          <textarea id="q" maxlength="2000" placeholder="질문하거나 문제를 요청하세요" title="Enter 전송, Shift+Enter 줄바꿈"></textarea>
          <button class="btn primary" id="send" type="submit">
            보내기<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
        <p class="composer-hint">Enter 전송 · Shift+Enter 줄바꿈 · 문제가 나오면 보기를 누르거나 A~D 키로 답할 수 있어요</p>
      </form>
    </section>
    <aside id="progressPanel" aria-label="학습 진도">
      <div class="panel-head">
        <h2>학습 진도</h2>
        <span class="who" id="panelUser"></span>
        <button class="btn ghost icon" id="refresh" type="button" title="새로고침" aria-label="진도 새로고침">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
        </button>
      </div>
      <div class="panel-body" id="progress"><p class="note">불러오는 중…</p></div>
      <div class="panel-foot">
        <label class="dev"><input type="checkbox" id="showTrace"> 개발 정보(trace) 표시</label>
      </div>
    </aside>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
