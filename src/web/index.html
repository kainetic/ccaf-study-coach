<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCA-F 학습 코치</title>
<!-- v2-5 웹 UI: src/api.py가 GET /로 서빙. 마크업만 두고 스타일은 style.css, 동작은 app.js (/static). 외부 의존성 없음. -->
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>CCA-F 학습 코치</h1>
    <label>user_id
      <input id="uid" list="uids" autocomplete="off" spellcheck="false" aria-label="user_id" placeholder="user_id">
      <datalist id="uids"><option value="web_demo"><option value="demo_heavy"><option value="demo_new"></datalist>
    </label>
    <button class="btn" id="reset" type="button">새 대화</button>
  </header>
  <div class="main">
    <section class="chat">
      <div id="log" aria-live="polite"></div>
      <form id="ask">
        <textarea id="q" maxlength="2000" placeholder="질문하거나 문제를 요청하세요" title="Enter 전송, Shift+Enter 줄바꿈"></textarea>
        <button class="btn primary" id="send" type="submit">보내기</button>
      </form>
    </section>
    <aside id="progressPanel">
      <h2>진도 <button class="btn" id="refresh" type="button">새로고침</button></h2>
      <div id="progress"><p class="note">불러오는 중…</p></div>
      <label class="dev"><input type="checkbox" id="showTrace"> 개발 정보(trace) 표시</label>
    </aside>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
